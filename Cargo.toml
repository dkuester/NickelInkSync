[package]
name = "nickelinksync"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Sync the reading progress of sideloaded ebooks between Kobo, Tolino and KOReader through a KOSync server"
license = "MIT"
repository = "https://github.com/dkuester/NickelInkSync"
publish = false

# The desktop client is a second package, so the device build
# (`-p nickelinksync`, also the default member) never compiles egui.
[workspace]
members = [".", "gui"]
default-members = ["."]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Reading a Kindle over MTP (`kindle-copy`), read only. Off by default, so the
# device build and the GUI stay as they are. Pinned exactly: 0.x, minor
# versions break (docs/kindle-mtp-feasibility.md).
mtp-rs = { version = "=0.38.0", optional = true }
futures = { version = "0.3", optional = true }

[features]
mtp = ["dep:mtp-rs", "dep:futures"]

# The KOSync key in the system keychain (macOS) or Credential Manager
# (Windows); not on the device or Linux, where it stays in config.ini.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

# Small binary for the device: size over speed, one codegen unit for LTO,
# no symbols or debug info.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
