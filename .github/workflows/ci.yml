name: CI

# Repository checks, the Rust host build, the device build and the plugin.
# The "Protect main" ruleset requires a status check named "check", so keep
# this job name; device build and plugin stay in this job so the ruleset
# covers them without changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: No device databases committed
        run: |
          if git ls-files | grep -E '\.(sqlite|db)(-wal|-shm|-journal)?$'; then
            echo "::error::Device database committed. Test fixtures must be trimmed and anonymized first."
            exit 1
          fi
      - name: No odd file names committed
        run: |
          python3 - <<'PY'
          import subprocess, sys
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")[:-1]
          bad = [n for n in names
                 if any(ord(c) < 32 or ord(c) == 127 for c in n)
                 or n.startswith("/") or "var/folders" in n or ".." in n.split("/")]
          for n in bad:
              print("::error::Odd file name committed (control characters, an absolute or temp path?): " + repr(n))
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local Markdown links resolve
        run: python .github/scripts/check_md_links.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # Statically linked musl binary: independent of the device glibc, so one
      # file runs on Kobo firmware 4.x and Tolino firmware 5.x.
      - name: Install cargo-zigbuild and Zig
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.17.0
      - name: Device build (armv7-unknown-linux-musleabihf)
        # Only the CLI package: the desktop client (gui/) never goes to the device.
        run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p nickelinksync
      - name: Device binary is a static 32-bit ARM ELF and runs under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user file
          bin=target/armv7-unknown-linux-musleabihf/release/nickelinksync
          info=$(file "$bin")
          echo "$info"
          echo "$info" | grep -q 'ELF 32-bit LSB executable, ARM' || { echo "::error::Not a 32-bit ARM executable"; exit 1; }
          echo "$info" | grep -qE 'statically linked|static-pie linked' || { echo "::error::Not statically linked"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nickelinksync") | .version')
          actual=$(qemu-arm "$bin" --version)
          echo "$actual"
          test "$actual" = "nickelinksync $version" || { echo "::error::Expected 'nickelinksync $version'"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nickelinksync-armv7-musleabihf
          path: target/armv7-unknown-linux-musleabihf/release/nickelinksync
          if-no-files-found: error
      # The symbol list comes from the Tolino firmware 5.18.264769, so it is
      # not in this repository; the owner's NickelTolinoShopRedirect has it.
      - name: Plugin symbols exist in libnickel 5.18
        run: |
          ref="$RUNNER_TEMP/libnickel-5.18.syms.gz"
          curl -fsSL -o "$ref" https://raw.githubusercontent.com/dkuester/NickelTolinoShopRedirect/5e4e2bf6fadbd3435b204c0282de00d02d297449/test/libnickel-5.18.syms.gz
          python tools/check_plugin_symbols.py "$ref"
      # The Kobo 6.0 list is made from Kobo's update (330 MB, the one the
      # Nickel VM uses) and cached; neither is in this repository.
      - name: Cache the libnickel 6.0 symbol list
        uses: actions/cache@v4
        with:
          path: ~/.cache/nickelinksync/libnickel-6.0.279225.syms.gz
          key: libnickel-6.0.279225-syms-v1
      - name: Plugin symbols exist in libnickel 6.0
        run: |
          ref=~/.cache/nickelinksync/libnickel-6.0.279225.syms.gz
          if [ ! -f "$ref" ]; then
            fw="$RUNNER_TEMP/qt6-update-6.0.279225.zip"
            curl -fsSL -o "$fw" https://ereaderfiles.kobo.com/firmwares/kobo12/Oct2026/qt6-update-6.0.279225.zip
            echo "48b777179a79f68a5d1216e2a8ae20936f1bfacb6c5595351c9a6104b058f2ac  $fw" | sha256sum -c -
            mkdir -p "$(dirname "$ref")"
            tools/libnickel_symbols.sh "$fw" "$ref"
            rm "$fw"
          fi
          python tools/check_plugin_symbols.py "$ref"
      # Qt 6.5.2 toolchain (arm-kobo-linux-gnueabihf); the Qt 5 NickelTC
      # image cannot build a plugin for firmware 5.x.
      - name: Plugin build (Qt 6, Kobo.tgz)
        run: |
          docker run --rm --volume="$PWD:$PWD" --workdir="$PWD" ghcr.io/dkuester/nickelstorygraph-toolchain:latest \
            'make -C plugin && make -C plugin kobo && arm-kobo-linux-gnueabihf-nm -D plugin/libnickelinksync.so > plugin/nm.txt'
          lib=plugin/libnickelinksync.so
          file -b "$lib" | grep -q 'ELF 32-bit LSB shared object, ARM' || { echo "::error::Plugin is not a 32-bit ARM library"; exit 1; }
          grep -q '@Qt_6' plugin/nm.txt || { echo "::error::No Qt 6 symbols"; exit 1; }
          if grep -q '@Qt_5' plugin/nm.txt; then echo "::error::Qt 5 symbols in a Qt 6 build"; exit 1; fi
          for h in _nh_ReadingController__setVolume _nh_ReadingView__leavingReadingExperience; do
            grep -qE " T $h\$" plugin/nm.txt || { echo "::error::$h not exported"; exit 1; }
          done
          test "$(tar -tzf plugin/Kobo.tgz)" = "imageformats/libnickelinksync.so" || { echo "::error::Unexpected Kobo.tgz layout"; exit 1; }
      # Kobo firmware 4.x: the reference lists the symbols of the classes the
      # plugin uses in libnickel 4.38.23852 (tools/nickel_symbol_reference.py).
      - name: Plugin symbols exist in libnickel 4.38 (Qt 5)
        run: python tools/check_plugin_symbols.py --qt 5 tools/libnickel-4.38.23852.syms.gz
      # Qt 5.2.1 NickelTC (arm-nickel-linux-gnueabihf); Qt 5.2.1 has no symbol
      # versions, so the check is the library it needs and no Qt 6.
      - name: Plugin build (Qt 5, KoboRoot.tgz)
        run: |
          tools/build_plugin_qt5.sh
          lib=target/plugin-qt5/libnickelinksync.so
          dump=target/plugin-qt5/objdump.txt
          file -b "$lib" | grep -q 'ELF 32-bit LSB shared object, ARM' || { echo "::error::Qt 5 plugin is not a 32-bit ARM library"; exit 1; }
          grep -qE 'NEEDED +libQt5Core\.so\.5$' "$dump" || { echo "::error::Qt 5 plugin does not link Qt 5"; exit 1; }
          if grep -qE 'Qt_6|libQt6' "$dump"; then echo "::error::Qt 6 in a Qt 5 build"; exit 1; fi
          for h in _nh_ReadingController__setVolume _nh_ReadingView__leavingReadingExperience; do
            grep -qE " T $h\$" target/plugin-qt5/nm.txt || { echo "::error::$h not exported (Qt 5)"; exit 1; }
          done
          test "$(tar -tzf plugin/KoboRoot.tgz)" = "./usr/local/Kobo/imageformats/libnickelinksync.so" || { echo "::error::Unexpected KoboRoot.tgz layout"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-kobo4-KoboRoot
          path: plugin/KoboRoot.tgz
          if-no-files-found: error
      - name: Package for Kobo 6.0 and Tolino
        run: |
          d=dist/NickelInkSync
          mkdir -p "$d/.adds/NickelInkSync"
          cp plugin/Kobo.tgz "$d/"
          install -m 755 target/armv7-unknown-linux-musleabihf/release/nickelinksync "$d/.adds/NickelInkSync/"
          cp plugin/config.ini.example "$d/.adds/NickelInkSync/"
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-device
          path: dist/NickelInkSync/
          include-hidden-files: true
          if-no-files-found: error

  # The desktop client on the platform it targets first. Not a required
  # check (the ruleset requires "check" only).
  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p nickelinksync-gui --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p nickelinksync-gui
      - name: Build
        run: cargo build --release -p nickelinksync-gui

  # The Windows release files (the desktop client and the CLI as ZIPs) as an
  # artifact, after clippy; the tests run beside it in windows-tests, so the
  # files are there in a few minutes. Not required checks.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Package
        shell: pwsh
        run: packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-windows
          path: dist/*.zip
      # Kindle over MTP (release 0.2.0, stage M2): the CLI with the `mtp`
      # feature, compiled and linted on Windows, as a test binary for the
      # owner's Windows PC. Not a release file.
      - name: Clippy with the mtp feature
        run: cargo clippy -p nickelinksync --all-targets --features mtp -- -D warnings
      - name: Build the CLI with the mtp feature
        run: cargo build --release -p nickelinksync --features mtp
      - uses: actions/upload-artifact@v4
        with:
          name: nickelinksync-windows-mtp-test
          path: target/release/nickelinksync.exe

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        # All test programs, so one run shows every Windows failure.
        run: cargo test --workspace --no-fail-fast

  # The macOS release files (universal .app in a .dmg, the CLI as a ZIP),
  # as an artifact; the release workflow builds them the same way. Not a
  # required check.
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: rsvg-convert for the icon
        run: brew install librsvg
      - name: Package
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-macos
          path: |
            dist/*.dmg
            dist/*.zip
