name: CI

# Repository checks, the Rust host build, the device build and the plugin.
# The "Protect main" ruleset requires a status check named "check", so keep
# this job name; device build and plugin stay in this job so the ruleset
# covers them without changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: No device databases committed
        run: |
          if git ls-files | grep -E '\.(sqlite|db)(-wal|-shm|-journal)?$'; then
            echo "::error::Device database committed. Test fixtures must be trimmed and anonymized first."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local Markdown links resolve
        run: python .github/scripts/check_md_links.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # Statically linked musl binary: independent of the device glibc, so one
      # file runs on Kobo firmware 4.x and Tolino firmware 5.x.
      - name: Install cargo-zigbuild and Zig
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.17.0
      - name: Device build (armv7-unknown-linux-musleabihf)
        # Only the CLI package: the desktop client (gui/) never goes to the device.
        run: cargo zigbuild --release --target armv7-unknown-linux-musleabihf -p nickelinksync
      - name: Device binary is a static 32-bit ARM ELF and runs under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static file
          bin=target/armv7-unknown-linux-musleabihf/release/nickelinksync
          info=$(file "$bin")
          echo "$info"
          echo "$info" | grep -q 'ELF 32-bit LSB executable, ARM' || { echo "::error::Not a 32-bit ARM executable"; exit 1; }
          echo "$info" | grep -qE 'statically linked|static-pie linked' || { echo "::error::Not statically linked"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nickelinksync") | .version')
          actual=$(qemu-arm-static "$bin" --version)
          echo "$actual"
          test "$actual" = "nickelinksync $version" || { echo "::error::Expected 'nickelinksync $version'"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nickelinksync-armv7-musleabihf
          path: target/armv7-unknown-linux-musleabihf/release/nickelinksync
          if-no-files-found: error
      # The symbol list comes from the Tolino firmware 5.18.264769, so it is
      # not in this repository; the owner's NickelTolinoShopRedirect has it.
      - name: Plugin symbols exist in libnickel 5.18
        run: |
          ref="$RUNNER_TEMP/libnickel-5.18.syms.gz"
          curl -fsSL -o "$ref" https://raw.githubusercontent.com/dkuester/NickelTolinoShopRedirect/5e4e2bf6fadbd3435b204c0282de00d02d297449/test/libnickel-5.18.syms.gz
          python tools/check_plugin_symbols.py "$ref"
      # Qt 6.5.2 toolchain (arm-kobo-linux-gnueabihf); the Qt 5 NickelTC
      # image cannot build a plugin for firmware 5.x.
      - name: Plugin build (Qt 6, Kobo.tgz)
        run: |
          docker run --rm --volume="$PWD:$PWD" --workdir="$PWD" ghcr.io/dkuester/nickelstorygraph-toolchain:latest \
            'make -C plugin && make -C plugin kobo && arm-kobo-linux-gnueabihf-nm -D plugin/libnickelinksync.so > plugin/nm.txt'
          lib=plugin/libnickelinksync.so
          file -b "$lib" | grep -q 'ELF 32-bit LSB shared object, ARM' || { echo "::error::Plugin is not a 32-bit ARM library"; exit 1; }
          grep -q '@Qt_6' plugin/nm.txt || { echo "::error::No Qt 6 symbols"; exit 1; }
          if grep -q '@Qt_5' plugin/nm.txt; then echo "::error::Qt 5 symbols in a Qt 6 build"; exit 1; fi
          for h in _nh_ReadingController__setVolume _nh_ReadingView__leavingReadingExperience; do
            grep -qE " T $h\$" plugin/nm.txt || { echo "::error::$h not exported"; exit 1; }
          done
          test "$(tar -tzf plugin/Kobo.tgz)" = "imageformats/libnickelinksync.so" || { echo "::error::Unexpected Kobo.tgz layout"; exit 1; }
      - name: Package for the Tolino
        run: |
          d=dist/NickelInkSync
          mkdir -p "$d/.adds/NickelInkSync"
          cp plugin/Kobo.tgz "$d/"
          install -m 755 target/armv7-unknown-linux-musleabihf/release/nickelinksync "$d/.adds/NickelInkSync/"
          cp plugin/config.ini.example "$d/.adds/NickelInkSync/"
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-tolino
          path: dist/NickelInkSync/
          include-hidden-files: true
          if-no-files-found: error

  # The desktop client on the platform it targets first. Not a required
  # check (the ruleset requires "check" only).
  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p nickelinksync-gui --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p nickelinksync-gui
      - name: Build
        run: cargo build --release -p nickelinksync-gui

  # The Windows build: clippy and tests on Windows, then the release files
  # (the desktop client and the CLI as ZIPs) as an artifact. Not a required
  # check.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        # All test programs, so one run shows every Windows failure.
        run: cargo test --workspace --no-fail-fast
      - name: Package
        shell: pwsh
        run: packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-windows
          path: dist/*.zip

  # The macOS release files (universal .app in a .dmg, the CLI as a ZIP),
  # as an artifact; the release workflow builds them the same way. Not a
  # required check.
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: rsvg-convert for the icon
        run: brew install librsvg
      - name: Package
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NickelInkSync-macos
          path: |
            dist/*.dmg
            dist/*.zip
